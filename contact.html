<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Social Orbit Media</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #050508; color: #f0eeff; padding: 20px; line-height: 1.8; }
        .container { max-width: 600px; margin: auto; padding: 20px; }
        h1 { color: #ff3cac; border-bottom: 2px solid #784ba0; padding-bottom: 10px; font-size: 2.5rem; }
        p { color: #d1cffd; font-size: 1.1rem; }
        .back-btn { display: inline-block; background: #784ba0; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; margin-bottom: 30px; font-weight: bold; transition: 0.3s; }
        .back-btn:hover { background: #ff3cac; }
        .contact-info { background: #0d0d14; border-left: 4px solid #00f5d4; padding: 20px; margin: 20px 0; border-radius: 4px; }
        .contact-info strong { color: #00f5d4; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; color: #8a87a0; }
        input, textarea { width: 100%; padding: 10px; background: #13131f; border: 1px solid #784ba0; color: white; border-radius: 5px; box-sizing: border-box; }
        input:focus, textarea:focus { border-color: #00f5d4; outline: none; }
        .submit-btn { background: #ff3cac; color: white; border: none; padding: 12px 20px; font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%; transition: 0.3s; }
        .submit-btn:hover { background: #784ba0; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">← Back to Home</a>
        
        <h1>Contact Social Orbit Media</h1>
        <p>Have a project in mind or want to boost your digital presence? Reach out to us, and our team will get back to you within 24 hours.</p>
        
        <div class="contact-info">
            <p><strong>Email Us Directly:</strong> contact@socialorbitmedia.com</p>
            <p><strong>Location:</strong> Lahore, Punjab, Pakistan</p>
        </div>

        <!-- Real Working Contact Form -->
        <form action="https://api.web3forms.com/submit" method="POST">
            
            <!-- Aap ki unique Access Key yahan lag gayi hai -->
            <input type="hidden" name="access_key" value="cc835fb1-90d9-4647-b6c2-6d01783125da">
            
            <!-- Message send hone ke baad user ko aap ki website par redirect karne ke liye -->
            <input type="hidden" name="redirect" value="https://mudassirmustafa1473-design.github.io/Socialpulse/">

            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>
            </div>
            
            <div class="form-group">
                <label for="email">Your Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" placeholder="How can we help your business?" required></textarea>
            </div>
            
            <button type="submit" class="submit-btn">Send Message</button>
        </form>
    </div>
</body>
</html>
