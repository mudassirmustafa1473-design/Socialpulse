<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Orbit Media</title>
    <style>
        :root {
            --bg: #050508;
            --surface: #13131e;
            --text: #ffffff;
            --accent: #ff3cac;
            --grad: linear-gradient(135deg, #ff3cac, #784ba0, #2b86c5);
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        nav {
            padding: 30px;
            text-align: center;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            background: var(--grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero {
            padding: 100px 20px;
            text-align: center;
        }

        .hero h1 {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .services {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            flex-wrap: wrap;
        }

        .card {
            background: var(--surface);
            padding: 30px;
            border-radius: 15px;
            width: 300px;
            text-align: center;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">Social Orbit Media</div>
    </nav>

    <div class="hero">
        <h1>Grow Your Brand</h1>
        <p>Expert digital marketing and web solutions.</p>
    </div>

    <div class="services">
        <div class="card">
            <h3>Digital Marketing</h3>
            <p>Boost your online presence.</p>
        </div>
        <div class="card">
            <h3>Web Development</h3>
            <p>Modern and fast websites.</p>
        </div>
        <div class="card">
            <h3>Content Strategy</h3>
            <p>Engage your audience.</p>
        </div>
    </div>

</body>
</html>
