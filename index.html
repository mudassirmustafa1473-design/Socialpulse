<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Orbit Media | Digital Agency</title>
  <style>
    :root {
      --bg: #050508;
      --surface2: #13131e;
      --accent1: #ff3cac;
      --accent2: #784ba0;
      --accent3: #2b86c5;
      --text: #f0eeff;
      --border: rgba(255,255,255,0.07);
      --grad: linear-gradient(135deg, #ff3cac, #784ba0, #2b86c5);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background-color: var(--bg); 
      color: var(--text); 
      font-family: sans-serif; 
      overflow-x: hidden; 
    }

    nav { 
      padding: 20px 60px; 
      display: flex; 
      align-items: center; 
      border-bottom: 1px solid var(--border); 
    }

    .logo { 
      font-weight: 800; 
      font-size: 1.5rem; 
      background: var(--grad); 
      -webkit-background-clip: text; 
      -webkit-text-fill-color: transparent; 
    }

    .hero { 
      min-height: 80vh; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      text-align: center; 
    }

    h1 { font-size: 3.5rem; }
  </style>
</head>
<body>

  <nav>
    <div class="logo">Social Orbit Media</div>
  </nav>

  <section class="hero">
    <h1>Grow Your Brand</h1>
  </section>

</body>
</html>
